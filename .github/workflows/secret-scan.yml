name: secret-scan

# 与本地 pre-commit (scripts/secret-scan.py) 同规则的服务器端强制扫描。
# 三层防线: .gitignore(文件级) + pre-commit(本地内容级) + 本工作流(服务端强制, 绕过 --no-verify 也拦)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史扫描（与本地扫描器能力对齐，防历史夹带）

      - name: Run secret-scan on current tree
        run: python3 scripts/secret-scan-ci.py

      - name: Run secret-scan on full history (all blobs)
        run: |
          # 对历史中每个 blob 的每次出现做全量扫描
          python3 scripts/secret-scan-ci.py --history
